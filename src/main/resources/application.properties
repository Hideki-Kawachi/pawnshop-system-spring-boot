spring.application.name=pawnshopSystem
#configuration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.config.import=file:env.properties
spring.jpa.hibernate.ddl-auto=update
spring,jpa.properties.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=pawnshop_${ENVIRONMENT}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
flyway.locations=classpath:db/${ENVIRONMENT}
flyway.schemas=pawnshop_${ENVIRONMENT}
flyway.default-schema=pawnshop_${ENVIRONMENT}
flyway.enabled=true
#if database already has tables, flyway wont try to rerun old scripts
flyway.baseline-on-migrate=true
jwt.secret-key=${SECRET_KEY}